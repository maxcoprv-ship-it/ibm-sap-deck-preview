<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 Executive Meeting IBM – SAP · v2</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #161616;
      color: #f4f4f4;
      font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      padding: 48px 40px 56px;
    }

    /* ── Header ── */
    header {
      margin-bottom: 40px;
      border-left: 3px solid #0f62fe;
      padding-left: 16px;
    }

    header h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #ffffff;
      line-height: 1.3;
    }

    header p {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 300;
      color: #8d8d8d;
      letter-spacing: 0.02em;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }

    .slide-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .slide-cell img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }

    .slide-cell img:hover {
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(15, 98, 254, 0.5);
      transform: translateY(-2px);
    }

    .slide-num {
      font-size: 11px;
      font-weight: 400;
      color: #6f6f6f;
      letter-spacing: 0.04em;
      user-select: none;
    }

    /* ── Footer ── */
    footer {
      margin-top: 44px;
      padding-top: 20px;
      border-top: 1px solid #262626;
      font-size: 12px;
      color: #525252;
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    footer span {
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
    }
  </style>
</head>

  <header>
